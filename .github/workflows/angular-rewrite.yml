name: Angular rewrite validation

on:
  push:
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - 'vercel.json'
      - 'tools/**'
      - 'static/**'
      - 'docs/**'
      - '.github/workflows/angular-rewrite.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - 'vercel.json'
      - 'tools/**'
      - 'static/**'
      - 'docs/**'
      - '.github/workflows/angular-rewrite.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up npm
        run: npm install --global npm@11.17.0
      - name: Verify toolchain
        run: npm run verify:toolchain
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Check formatting
        run: npm run format:check
      - name: Verify TypeScript
        run: npm run verify:types
      - name: Verify project documentation contract
        run: npm run verify:docs
      - name: Verify deployment contract
        run: npm run verify:deployment
      - name: Run tests
        run: npm test -- --watch=false --no-progress
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Run browser journeys
        run: npm run test:e2e
      - name: Build production bundle
        run: npm run build
      - name: Verify publishable artifact contract
        run: npm run verify:deployment -- dist/hexakill/browser
      - name: Verify production preview contract
        run: npm run verify:preview
      - name: Run browser journeys against production artifact
        run: E2E_PRODUCTION=1 npm run test:e2e
      - name: Verify active asset paths
        run: npm run verify:assets
      - name: Inspect retained asset geometry
        run: npm run inspect:assets -- --json
      - name: Verify representative migrated assets
        run: |
          test -f dist/hexakill/browser/images/wizard/idle.gif
          test -f dist/hexakill/browser/images/wizard/sprites/Attack1.png
          test -f dist/hexakill/browser/images/samurai/Sprites/Attack1.png
          test -f dist/hexakill/browser/images/slime-blue/attack.gif
          test -f dist/hexakill/browser/images/slime-blue/die.gif
          test -f dist/hexakill/browser/images/evil-wizard/sprites/Attack1.png
          test -f dist/hexakill/browser/images/evil-wizard/sprites/Death.png
          test -f dist/hexakill/browser/images/fire-worm/Sprites/Worm/Attack.png
          test -f dist/hexakill/browser/images/fire-worm/Sprites/Worm/Death.png
          test -f dist/hexakill/browser/images/martial-hero/Sprite/Attack1.png
          test -f dist/hexakill/browser/images/martial-hero/Sprite/Death.png
          test -f dist/hexakill/browser/images/samurai/Sprites/Death.png
          test -f dist/hexakill/browser/images/wild-huntress/sprites/Attack1.png
          test -f dist/hexakill/browser/images/wild-huntress/sprites/Death.png
          test -f dist/hexakill/browser/images/witch-blue/assets/B_witch_attack.png
          test -f dist/hexakill/browser/images/witch-blue/assets/B_witch_death.png
          test -f dist/hexakill/browser/images/wizard/sprites/Death.png
          test -f dist/hexakill/browser/sounds/attack.mp3
          test "$(find dist/hexakill/browser/images -name idle.gif | wc -l | tr -d ' ')" -ge 21
      - name: Retain validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angular-validation-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
            dist/hexakill/browser/
          if-no-files-found: ignore
          retention-days: 14
