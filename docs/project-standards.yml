    - id: TEST-008
      status: partial
      evidence: 'Active Angular baseline: 84 tests and 25 Playwright journeys, including invalid numeric reducer payload rejection, finite random-roll boundary rejection, malformed combat stats/resistance/damage-total/speed/potion-state rejection, non-finite level/boss-progress rejection, safe-integer personal-record and restored-session counter validation, positive restored health validation, invalid heal-input rejection, integer power-up-count and unknown power-up identifier rejection, malformed store gold/potion/inventory/stat-state rejection, strict legacy critical/miss-threshold boundaries, name-field validation semantics, terminal-phase action rejection, impossible terminal-session rejection, skip-link keyboard access, malformed-preference/personal-record recovery, over-cap-power-up and duplicate-inventory persistence rejection, Wizard Idle/Attack1/Attack2/hit provisional player-action mapping, physical/Magic/hit/idle Evil Wizard, Knight, and Witch Blue animation mapping including Witch Blue Magic charge, durable transient/malformed-result rejection, bounded eight-entry combat-log lifecycle, and store/progression edge cases; broader gameplay/accessibility coverage remains incomplete.'
      priority: high
      next_action: Retain the automated focus/responsive assertions and add manual accessibility evidence before release.
    - id: TS-001
      status: partial
      evidence: The active Angular root has strict compiler settings and npm run verify:types passes tsc --noEmit for the application and test projects; the archived Svelte npm run check command still references missing jsconfig.json.
      priority: high
      next_action: Retain the active compiler gate and do not revive archived tooling without a decision.
    - id: TS-005
      status: partial
      evidence: Archived Svelte storage trusts JSON.parse; active Angular session and records adapters validate versioned browser envelopes.
      priority: high
      next_action: Decide legacy-key migration and retain runtime validation for new schemas.
    - id: DEP-001
      status: partial
      evidence: The archived Svelte package has no tracked lockfile; the active Angular root has a committed package-lock.json, pinned Node/npm baseline, and frozen-install validation.
      priority: high
      next_action: Retain the root Angular baseline and remove/archive legacy package metadata when the historical audit is complete.
    - id: CI-001
      status: partial
      evidence: .github/workflows/angular-rewrite.yml validates active root/docs changes with frozen install, formatting, TypeScript, docs, deployment-contract, publishable-artifact, source and artifact asset-path/SHA parity, source and artifact typed sprite-geometry checks, tests, preview-contract checks, dev-server and production-artifact browser journeys, build, and configured validation-artifact retention; the root also exposes a local aggregate release gate; archived Svelte is intentionally out of scope.
      priority: high
      next_action: Verify the remote workflow and keep the gates aligned with top-level promotion.
    - id: A11Y-002
      status: partial
      evidence: Archived Svelte source has non-keyboard tooltip/store findings; the active root replaces those interactions with buttons and covers keyboard activation for the core run controls.
      priority: high
      next_action: Complete manual screen-reader, contrast, zoom, and focus-visibility review across the core run journey.

